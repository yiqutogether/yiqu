<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>关键词作战台</title>
    <link rel="stylesheet" href="../assets/styles.css?v=20260816-submit-visible">
  </head>
  <body class="app-page">
    <header class="topbar">
      <div>
        <div class="eyebrow">Yiqu-AMZ工作台</div>
        <h1>关键词作战台</h1>
      </div>
      <button id="logout" class="ghost-button" type="button">退出登录</button>
    </header>

    <main class="tool-layout">
      <aside class="submit-panel" aria-label="提交任务">
        <form id="task-form" class="form-stack">
          <label>
            站点
            <input id="site" name="site" list="site-options" autocomplete="off" placeholder="US / 美国" required>
            <datalist id="site-options"></datalist>
            <span class="field-hint" data-hint-for="site">正在加载产品映射...</span>
          </label>
          <label>
            店铺
            <input id="store" name="store" list="store-options" autocomplete="off" placeholder="输入或选择店铺">
            <datalist id="store-options"></datalist>
            <span class="field-hint" data-hint-for="store"></span>
          </label>
          <label>
            一级分类
            <input id="category1" name="category1" list="category1-options" autocomplete="off" placeholder="输入或选择一级分类">
            <datalist id="category1-options"></datalist>
            <span class="field-hint" data-hint-for="category1"></span>
          </label>
          <label>
            二级分类
            <input id="category2" name="category2" list="category2-options" autocomplete="off" placeholder="输入或选择二级分类">
            <datalist id="category2-options"></datalist>
            <span class="field-hint" data-hint-for="category2"></span>
          </label>
          <label>
            三级分类
            <input id="category3" name="category3" list="category3-options" autocomplete="off" placeholder="输入或选择三级分类">
            <datalist id="category3-options"></datalist>
            <span class="field-hint" data-hint-for="category3"></span>
          </label>
          <div class="field-grid">
            <label>
              SPU
              <input id="spu" name="spu" list="spu-options" autocomplete="off" placeholder="如 IB7036">
              <datalist id="spu-options"></datalist>
              <span class="field-hint" data-hint-for="spu"></span>
            </label>
            <label>
              SKU
              <input id="sku" name="sku" list="sku-options" autocomplete="off" placeholder="如 IB7036-BLACK">
              <datalist id="sku-options"></datalist>
              <span class="field-hint" data-hint-for="sku"></span>
            </label>
          </div>
          <label>
            ASIN
            <input id="asin" name="asin" list="asin-options" autocomplete="off" inputmode="latin" maxlength="10" placeholder="B09V366BDY" required>
            <datalist id="asin-options"></datalist>
            <span class="field-hint" data-hint-for="asin"></span>
          </label>
          <div id="product-summary" class="product-summary" aria-live="polite">
            选择 ASIN 后显示产品信息。
          </div>
          <label>
            广告报表
            <input id="report-file" name="report-file" type="file" accept=".xlsx,.csv" required>
          </label>
          <div class="usage-note">
            <strong>使用规则</strong>
            <p>每个字段都可输入搜索，也可点候选选择。可直接从 SPU、SKU 或 ASIN 开始；系统会自动补齐能唯一确定的字段。</p>
            <p>换产品时直接在任意字段输入新内容即可，系统会自动清掉冲突的旧条件。红框表示当前匹配到多个可能值，需要继续选择。</p>
            <button id="clear-product-fields" class="mini-button" type="button">清空重选</button>
          </div>
          <button id="submit-task" class="primary-button" type="submit">提交分析</button>
          <p id="task-message" class="form-message" role="status"></p>
        </form>
      </aside>

      <section class="task-section" aria-label="任务列表">
        <div class="section-head">
          <div>
            <div class="eyebrow">我的任务</div>
            <h2>任务列表</h2>
          </div>
          <button id="refresh-tasks" class="ghost-button" type="button">刷新</button>
        </div>
        <div id="tasks" class="task-list"></div>
      </section>
    </main>

    <script src="../assets/app.js?v=20260816-submit-visible"></script>
    <script>
      window.YiquApp.initToolPage();
    </script>
  </body>
</html>
