<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>关键词作战台</title>
    <link rel="stylesheet" href="../assets/styles.css?v=20260815-product-map">
  </head>
  <body class="app-page">
    <header class="topbar">
      <div>
        <div class="eyebrow">Yiqu-AMZ工作台</div>
        <h1>关键词作战台</h1>
      </div>
      <button id="logout" class="ghost-button" type="button">退出登录</button>
    </header>

    <main class="tool-layout">
      <aside class="submit-panel" aria-label="提交任务">
        <form id="task-form" class="form-stack">
          <label>
            站点
            <select id="site" name="site" required>
              <option value="">正在加载产品映射...</option>
            </select>
          </label>
          <label>
            店铺
            <select id="store" name="store" disabled>
              <option value="">先选择站点</option>
            </select>
          </label>
          <label>
            一级分类
            <select id="category1" name="category1" disabled>
              <option value="">先选择店铺</option>
            </select>
          </label>
          <label>
            二级分类
            <select id="category2" name="category2" disabled>
              <option value="">先选择一级分类</option>
            </select>
          </label>
          <label>
            三级分类
            <select id="category3" name="category3" disabled>
              <option value="">先选择二级分类</option>
            </select>
          </label>
          <div class="field-grid">
            <label>
              SPU
              <select id="spu" name="spu" disabled>
                <option value="">先选择分类</option>
              </select>
            </label>
            <label>
              SKU
              <select id="sku" name="sku" disabled>
                <option value="">先选择 SPU</option>
              </select>
            </label>
          </div>
          <label>
            ASIN
            <select id="asin" name="asin" required disabled>
              <option value="">先选择 SKU</option>
            </select>
          </label>
          <div id="product-summary" class="product-summary" aria-live="polite">
            选择 ASIN 后显示产品信息。
          </div>
          <label>
            广告报表
            <input id="report-file" name="report-file" type="file" accept=".xlsx,.csv" required>
          </label>
          <button id="submit-task" class="primary-button" type="submit">提交分析</button>
          <p id="task-message" class="form-message" role="status"></p>
        </form>
      </aside>

      <section class="task-section" aria-label="任务列表">
        <div class="section-head">
          <div>
            <div class="eyebrow">我的任务</div>
            <h2>任务列表</h2>
          </div>
          <button id="refresh-tasks" class="ghost-button" type="button">刷新</button>
        </div>
        <div id="tasks" class="task-list"></div>
      </section>
    </main>

    <script src="../assets/app.js?v=20260815-product-map"></script>
    <script>
      window.YiquApp.initToolPage();
    </script>
  </body>
</html>
